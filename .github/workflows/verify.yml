name: Verify EchoReel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon fmt --check tools/import_capture.mbtx tools/verify.mbtx
      - run: moon info --target all
      - run: git diff --exit-code
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: wasm }
          - { os: ubuntu-latest, target: wasm-gc }
          - { os: ubuntu-latest, target: js }
          - { os: ubuntu-latest, target: native }
          - { os: macos-latest, target: native }
          - { os: windows-latest, target: native }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
      - run: moon version --all
      - run: moon update
      - run: moon run tools/verify.mbtx ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update
      - if: runner.os == 'Linux'
        run: sudo apt-get install --yes libxml2-utils
      - if: runner.os == 'Linux'
        run: xmllint --noout _build/echoreel-${{ matrix.target }}.xml _build/echoreel-${{ matrix.target }}-failure.xml _build/echoreel-suite-${{ matrix.target }}.xml _build/echoreel-suite-${{ matrix.target }}-failure.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-${{ matrix.os }}-${{ matrix.target }}
          path: |
            _build/echoreel-${{ matrix.target }}.xml
            _build/echoreel-${{ matrix.target }}-failure.xml
            _build/echoreel-suite-${{ matrix.target }}.xml
            _build/echoreel-suite-${{ matrix.target }}-failure.xml
          if-no-files-found: ignore
